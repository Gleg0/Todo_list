{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Tags</h2>
  <a href="{% url 'tag-add' %}" class="btn btn-success">Add Tag</a>
</div>

<ul class="list-group">
  {% for tag in tags %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
      <div>
        <strong>{{ tag.name }}</strong>
      </div>
      <div>
        <a href="{% url 'tag-update' tag.pk %}" class="btn btn-sm btn-outline-primary">Edit</a>
        <a href="{% url 'tag-delete' tag.pk %}" class="btn btn-sm btn-outline-danger">Delete</a>
      </div>
    </li>
  {% empty %}
    <li class="list-group-item text-muted">No tags yet</li>
  {% endfor %}
</ul>
{% endblock %}
